# RouterMonitor ESP32-S3 configuration (UTF-8)
# Copy this file to config.properties before building.

WIFI_SSID=replace-with-wifi-name
WIFI_PASSWORD=replace-with-wifi-password

ROUTER_URL=http://192.168.1.1
ROUTER_PASSWORD=replace-with-router-admin-password

# mac or name
TARGET_TYPE=mac
TARGET_VALUE=AA-BB-CC-DD-EE-FF

# Minimum: 10 seconds
QUERY_INTERVAL_SECONDS=60

# Multiple tokens can be separated by comma or semicolon.
PUSHPLUS_TOKEN=replace-with-pushplus-token

# Optional, default: 10 seconds
REQUEST_TIMEOUT_SECONDS=10

# POSIX TZ string. China Standard Time is CST-8.
TIMEZONE=CST-8
